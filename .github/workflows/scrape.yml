name: Scrape NBFC/FII lists

on:
  schedule:
    # Runs 03:00 UTC (08:30 IST) every Monday.
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        run: npm run scrape
        env:
          MASTER_LIST_DATE_OVERRIDE: ""
          # A source that cannot be downloaded (RBI/NHB sometimes block GitHub's servers) is reused from this file.
          PREVIOUS_OUTPUT: data/Combine_List_Output.xlsx

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: combine-list-output
          path: |
            output/Combine_List_Output.xlsx
            output/run-log.json
            output/diagnostics/**
          retention-days: 90

      - name: Check run is complete enough to publish
        id: gate
        run: node scripts/should_commit.mjs
        continue-on-error: true

      - name: Commit updated output
        if: steps.gate.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          cp output/Combine_List_Output.xlsx data/Combine_List_Output.xlsx
          cp output/run-log.json data/run-log.json
          git add data/Combine_List_Output.xlsx data/run-log.json
          git diff --cached --quiet || git commit -m "chore: refresh scraped entity list [skip ci]"
          git pull --rebase
          git push
