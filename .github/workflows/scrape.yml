name: Scrape NBFC/FII lists

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Run scraper
        run: npm run scrape

      - name: Upload output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: combine-list-output
          path: |
            output/Combine_List_Output.xlsx
            output/run-log.json
          retention-days: 90
